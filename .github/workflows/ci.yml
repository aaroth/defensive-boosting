name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest experiments.test_core experiments.test_adaptive
      - name: Synthetic smoke test
        run: python -m experiments.run --quick --no-plots --no-progress --out experiments/out/ci
